# Tooling configuration only — dependencies are installed from requirements.txt.

[project]
name = "eaeu-regulatory-assistant"
version = "1.0.0"
description = "RAG-ассистент регуляторной поддержки регистрации лекарственных препаратов в ЕАЭС"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213", "ANN101", "ANN102", "D100"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
